# Skyforge server defaults — tuned for ~6-10 players on a 12-16 GB server
motd=§6§l⚙ Skyforge §r§7| §eThe Charter Audits
§8Steampunk colonies · Create · Magic · friends only
gamemode=survival
difficulty=hard
hardcore=false

# View / sim distance — keep low to save server CPU. Players use Distant Horizons clientside for far view.
view-distance=8
simulation-distance=6

# Capacity
max-players=10
max-tick-time=120000
max-world-size=29999984

# Allow flight (Aeronautics, jetpacks, spell-flight)
allow-flight=true
allow-nether=true

# Networking
server-port=25565
network-compression-threshold=256
enable-rcon=false
online-mode=true
prevent-proxy-connections=false

# World gen
level-type=minecraft\:normal
generate-structures=true
spawn-protection=8
op-permission-level=4

# Resource pack (leave empty unless you host one)
resource-pack=
resource-pack-sha1=
require-resource-pack=false

# Voice chat (handled by Simple Voice Chat mod on UDP 24454)
broadcast-rcon-to-ops=true
broadcast-console-to-ops=true

# Disable for headless server
enable-jmx-monitoring=false
sync-chunk-writes=true

# Keep these unless you know better
function-permission-level=2
enforce-whitelist=false
white-list=false
pvp=true
spawn-monsters=true
spawn-npcs=true
spawn-animals=true
